# Upstream для Next.js приложения
upstream nutriscan_backend {
    server nutriscan-app:3000;
    keepalive 32;
}

# HTTP сервер - редирект на HTTPS
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    
    # Для Let's Encrypt валидации
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
    
    # Редирект всех HTTP запросов на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;
    
    # SSL конфигурация
    ssl_certificate /etc/nginx/ssl/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/your-domain.com/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/your-domain.com/chain.pem;
    
    # SSL параметры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Корневая директория и индексные файлы
    root /var/www/html;
    index index.html;
    
    # Логирование
    access_log /var/log/nginx/nutriscan.access.log main;
    error_log /var/log/nginx/nutriscan.error.log warn;
    
    # Основное проксирование к Next.js приложению
    location / {
        # Применяем rate limiting
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://nutriscan_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Буферизация
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # API endpoints с отдельным rate limiting
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass http://nutriscan_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Статические файлы Next.js
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://nutriscan_backend;
    }
    
    # Публичные статические файлы
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://nutriscan_backend;
    }
    
    # Изображения и медиа
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        proxy_pass http://nutriscan_backend;
    }
    
    # CSS и JS файлы
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        proxy_pass http://nutriscan_backend;
    }
    
    # Favicon
    location /favicon.ico {
        expires 7d;
        add_header Cache-Control "public";
        proxy_pass http://nutriscan_backend;
    }
    
    # Robots.txt
    location /robots.txt {
        expires 7d;
        add_header Cache-Control "public";
        proxy_pass http://nutriscan_backend;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}